name: CI

# Nothing publishes unless every gate passes: content schema (in the build), editorial
# gates, source links, and the built-output tests. Add a deploy step once hosting is chosen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Editorial gates
        run: npm run verify
      - name: Source links (report only: news sites often block bots)
        run: npm run verify:links || echo "::warning::Some source links failed; check the log."
      - name: Build (schema gate, share cards, search index)
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Built-output tests
        run: npm test
